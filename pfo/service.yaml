apiVersion: v1
kind: Service
metadata:
  name: pfo
  labels:
    app: pfo
spec:
  type: ClusterIP
  selector:
    app: pfo
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pfo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: pfo.umtdg.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pfo
                port:
                  number: 8080
