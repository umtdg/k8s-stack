cluster:
  name: {{ .Values.postgres.cluster }}
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  storage:
    size: 50Gi
    storageClass: {{ .Values.storage.className }}

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  parameters:
    max_connections: "100"
    shared_buffers: "256MB"

  initdb:
    database: app
    owner: app

databases:
  {{- range .Values.postgres.databases }}
  - name: {{ .name }}
    secret: {{ .secret }}
  {{- end }}
