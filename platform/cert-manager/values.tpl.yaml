{{- $issuer := .Values.tls.issuer }}

email: {{ .Values.owner.email }}

cloudflare:
  secret: {{ .Values.secrets.cloudflare.name }}
  key: {{ .Values.secrets.cloudflare.key }}

issuers:
  - name: {{ $issuer.staging }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    accountKeySecret: le-staging-key
  - name: {{ $issuer.prod }}
    server: https://acme-v02.api.letsencrypt.org/directory
    accountKeySecret: le-key

cert-manager:
  crds:
    enabled: true
    keep: true

  extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers={{ join "," .Values.tls.resolvers }}
