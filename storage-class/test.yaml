apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: probe
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: local-path

  resources:
    requests:
      storage: 1Gi

---

apiVersion: v1
kind: Pod
metadata:
  name: probe
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36
      command: ["sh", "-c", "echo ok > /data/probe.txt && sleep 3600"]
      volumeMounts:
        - name: vol
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi

  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: probe
