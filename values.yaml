repo:
  url: git@github.com:umtdg/k8s-stack.git
  revision: main

retry:
  limit: 5
  refresh: true
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 3m

domain: umtdg.com

owner:
  email: me@umtdg.com

network:
  ingressVIP: 10.10.10.200
  pool:
    name: lan
    start: 10.10.10.200
    end: 10.10.10.210
    interface: eth0

ingress:
  className: nginx
  wildcardSecret: wildcard-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

tls:
  issuer:
    prod: letsencrypt

storage:
  className: local-path

postgres:
  cluster: pg
  namespace: cnpg
  port: 5432
  # One database per service under the service's name:
  #   - secret:         in the postgres' namespace, the database role
  #   - consumer.secret in the service's namespace, what the service logs in with
  databases:
    pfo:
      name: portfolio
      secret: pfo-db-creds
      consumer:
        secret: pfo-db
    gitea:
      name: gitea
      secret: gitea-db-creds
      consumer:
        secret: gitea-db-creds

gitea:
  namespace: gitea
  ssh:
    port: 22
