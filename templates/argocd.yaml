apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: platform/argocd
    helm:
      valuesObject:
        argo-cd:
          global:
            domain: argo.{{ .Values.domain }}
          crds:
            install: true
            keep: true
          configs:
            params:
              # Without this, nginx speaks HTTPS to a backend that redirects to HTTPS and
              # the browser loops.
              server.insecure: true
            cm:
              # This matters for adopting resources that Helm already labelled. Changing
              # it later forces a re-adoption of everything.
              application.resourceTrackingMethod: annotation
              timeout.reconciliation: 180s
              resource.customizations.health.argoproj.io_Application: |
                hs = {}
                hs.status = "Progressing"
                hs.message = ""
                if obj.status ~= nil then
                  if obj.status.health ~= nil then
                    hs.status = obj.status.health.status
                    if obj.status.health.message ~= nil then
                      hs.message = obj.status.health.message
                    end
                  end
                end
                return hs
          dex:
            enabled: false
          notifications:
            enabled: false
          controller:
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                memory: 1Gi
          repoServer:
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 1Gi
          server:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            ingress:
              enabled: true
              ingressClassName: {{ .Values.ingress.className }}
              # This makes nginx to fall back to `controller.extraArgs.default-ssl-certificate`
              # which is the default ingress-nginx/wildcard-tls.
              tls: false
              annotations:
                {{- toYaml .Values.ingress.annotations | nindent 16 }}
                nginx.ingress.kubernetes.io/backend-protocol: HTTP
          redis:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          applicationSet:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      {{- toYaml .Values.retry | nindent 6 }}
