{{- include "homelab.validate" . }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ include "homelab.argocd.namespace" . }}
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    path: .
    targetRevision: {{ .Values.repo.revision | quote }}
    helm:
      releaseName: {{ .Chart.Name }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "homelab.argocd.namespace" . }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      {{- toYaml .Values.argoDefaults.retry | nindent 6 }}
