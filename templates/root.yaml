apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    {{- /* No limit: Argo CD never retries a failed automatic sync of the same */}}
    {{- /* commit by itself, and every later wave would wait for the next commit. */}}
    retry:
      limit: -1
      refresh: true
      backoff:
        {{- toYaml .Values.retry.backoff | nindent 8 }}
