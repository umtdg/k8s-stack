{{- include "homelab.validate" . }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ include "homelab.argocd.namespace" . }}
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    path: generated
    targetRevision: {{ .Values.repo.revision | quote }}
    helm:
      releaseName: {{ .Chart.Name }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "homelab.argocd.namespace" . }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    {{- /* No limit: Argo CD never retries a failed automatic sync of the same commit by itself, and every later wave would wait for the next commit. */}}
    retry:
      limit: -1
      refresh: true
      backoff:
        {{- toYaml .Values.argoDefaults.retry.backoff | nindent 8 }}
