{{- include "homelab.validate" . }}

{{- $v := .Values }}
{{- $data := dict
  "HOMELAB_DOMAIN" $v.domain
  "HOMELAB_OWNER_EMAIL" $v.owner.email
  "HOMELAB_OWNER_USER" $v.owner.user
  "HOMELAB_NODE_IP" $v.network.nodeIP
  "HOMELAB_INGRESS_VIP" $v.network.ingressVIP
  "HOMELAB_POOL_NAME" $v.network.pool.name
  "HOMELAB_POOL_START" $v.network.pool.start
  "HOMELAB_POOL_END" $v.network.pool.end
  "HOMELAB_POOL_INTERFACE" $v.network.pool.interface
  "HOMELAB_INGRESS_CLASS" $v.ingress.className
  "HOMELAB_WILDCARD_SECRET" $v.ingress.wildcardSecret
  "HOMELAB_ISSUER_PROD" $v.tls.issuer.prod
  "HOMELAB_ISSUER_STAGING" $v.tls.issuer.staging
  "HOMELAB_DNS_RESOLVERS" (join "," $v.tls.resolvers)
  "HOMELAB_STORAGE_CLASS" $v.storage.className
  "HOMELAB_STORAGE_HOST_PATH" $v.storage.hostPath
  "HOMELAB_POSTGRES_CLUSTER" $v.postgres.cluster
  "HOMELAB_POSTGRES_HOST" (include "homelab.postgres.host" .)
  "HOMELAB_POSTGRES_PORT" $v.postgres.port
  "HOMELAB_ARGOCD_PROJECT" $v.argoDefaults.project
  "HOMELAB_REPO_URL" $v.repo.url
  "HOMELAB_REPO_REVISION" $v.repo.revision
}}
{{- $services := list }}
{{- range $name, $_ := $v.services }}
{{- $svc := include "homelab.service" (list $ $name) | fromYaml }}
{{- $key := $name | upper | replace "-" "_" }}
{{- $services = append $services $name }}
{{- $_ := set $data (printf "HOMELAB_SERVICE_%s_DIR" $key) $svc.dir }}
{{- $_ := set $data (printf "HOMELAB_SERVICE_%s_NAMESPACE" $key) $svc.namespace }}
{{- $_ := set $data (printf "HOMELAB_SERVICE_%s_RELEASE" $key) $svc.releaseName }}
{{- $_ := set $data (printf "HOMELAB_SERVICE_%s_WAVE" $key) (int $svc.wave) }}
{{- if $svc.host }}
{{- $_ := set $data (printf "HOMELAB_SERVICE_%s_HOST" $key) (include "homelab.fqdn" (list $ $svc.host)) }}
{{- end }}
{{- end }}
{{- $_ := set $data "HOMELAB_SERVICES" (join " " $services) }}
{{- $databases := list }}
{{- range $v.postgres.databases }}
{{- $key := .name | upper }}
{{- $databases = append $databases .name }}
{{- $_ := set $data (printf "HOMELAB_DATABASE_%s_SECRET" $key) .secret }}
{{- $_ := set $data (printf "HOMELAB_DATABASE_%s_CONSUMER_NAMESPACE" $key) (include "homelab.namespace" (list $ .consumer.service)) }}
{{- $_ := set $data (printf "HOMELAB_DATABASE_%s_CONSUMER_SECRET" $key) .consumer.secret }}
{{- end }}
{{- $_ := set $data "HOMELAB_DATABASES" (join " " $databases) }}
{{- range $name, $secret := $v.secrets }}
{{- $key := $name | snakecase | upper }}
{{- $_ := set $data (printf "HOMELAB_SECRET_%s_NAMESPACE" $key) (include "homelab.namespace" (list $ $secret.service)) }}
{{- $_ := set $data (printf "HOMELAB_SECRET_%s_NAME" $key) $secret.name }}
{{- with $secret.key }}
{{- $_ := set $data (printf "HOMELAB_SECRET_%s_KEY" $key) . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-config
  namespace: {{ include "homelab.argocd.namespace" . }}
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
