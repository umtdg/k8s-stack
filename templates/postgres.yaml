apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: platform/postgres
    helm:
      valuesObject:
        cluster:
          name: {{ .Values.postgres.cluster }}
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
          storage:
            size: 50Gi
            storageClass: {{ .Values.storage.className }}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          parameters:
            max_connections: "100"
            shared_buffers: "256MB"
          initdb:
            database: app
            owner: app
        databases:
          {{- range .Values.postgres.databases }}
          - name: {{ .name }}
            secret: {{ .secret }}
          {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.postgres.namespace }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      {{- toYaml .Values.retry | nindent 6 }}
