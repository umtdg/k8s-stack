{{- $host := include "homelab.host" (list . .service.name) }}
{{- $database := include "homelab.databaseFor" (list . .service.name) | fromYaml }}
{{- $ssh := .service.ssh }}
gitea:
  strategy:
    type: Recreate

  image:
    rootless: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  persistence:
    enabled: true
    create: true
    claimName: gitea-shared-storage
    storageClass: {{ .Values.storage.className }}
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false,Delete=false

  service:
    http:
      type: ClusterIP
      port: 3000
    ssh:
      type: ClusterIP
      port: {{ $ssh.port }}
      clusterIP: ""

  ingress:
    enabled: true
    className: {{ .Values.ingress.className }}
    annotations:
      {{- include "homelab.ingress.annotations" . | nindent 6 }}
      nginx.ingress.kubernetes.io/proxy-body-size: 512m
    tls: []
    hosts:
      - host: {{ $host }}
        paths:
          - path: /
            pathType: Prefix

  gitea:
    admin:
      existingSecret: {{ .Values.secrets.giteaAdmin.name }}
      email: {{ .Values.owner.email }}
      passwordMode: initialOnlyRequireReset

    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__USER
        valueFrom:
          secretKeyRef:
            name: {{ $database.consumer.secret }}
            key: username
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: {{ $database.consumer.secret }}
            key: password

    config:
      APP_NAME: {{ $host }}

      database:
        DB_TYPE: postgres
        HOST: {{ include "homelab.postgres.address" . }}
        NAME: {{ $database.name }}
        SSL_MODE: require

      server:
        DOMAIN: {{ $host }}
        ROOT_URL: https://{{ $host }}/
        SSH_DOMAIN: {{ $host }}
        SSH_PORT: {{ $ssh.port | quote }}
        SSH_LISTEN_PORT: {{ $ssh.listenPort | quote }}
        LFS_START_SERVER: true

      service:
        DISABLE_REGISTRATION: true
        REQUIRE_SIGNIN_VIEW: true

      repository:
        DEFAULT_PRIVATE: private
        DEFAULT_BRANCH: main

      session:
        PROVIDER: db

      actions:
        ENABLED: true

  redis-cluster:
    enabled: false

  postgresql:
    enabled: false

  postgresql-ha:
    enabled: false

  valkey:
    enabled: false

  valkey-cluster:
    enabled: false

  test:
    enabled: false
